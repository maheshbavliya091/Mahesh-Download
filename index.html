<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>Download Game</title>
<style>
body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f2; }
button { padding: 16px 32px; font-size: 18px; background: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; }
button:hover { background: #256428; }
p { color: #555; margin-top: 12px; }
</style>
</head>
<body>
<button onclick="startDownload()">Download Game</button>
<p id="status"></p>
<script>
var DOWNLOAD_COUNT = 2;
var fileUrls = [
"https://hil-speed.hetzner.com/10GB.bin",
"https://fsn-speed.hetzner.com/10GB.bin",
"https://nbg-speed.hetzner.com/10GB.bin",
"https://ash-speed.hetzner.com/10GB.bin"
];
function startDownload() {
document.getElementById("status").innerText = "Download shuru thai rahyu chhe...";
for (var i = 0; i < DOWNLOAD_COUNT; i++) {
(function(index) {
setTimeout(function() {
var link = document.createElement("a");
link.href = fileUrls[index];
link.download = "file" + (index+1) + ".bin";
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
if (index === DOWNLOAD_COUNT - 1) {
document.getElementById("status").innerText = DOWNLOAD_COUNT + " downloads chalu thai gaya!";
}
}, index * 1000);
})(i);
}
}
</script>
</body>
</html>
