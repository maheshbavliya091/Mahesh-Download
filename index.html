<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>Download Game</title>
<style>
body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f2; }
button { padding: 16px 32px; font-size: 18px; background: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px; }
button:hover { background: #256428; }
input { padding: 10px; font-size: 18px; width: 80px; text-align: center; border: 2px solid #2e7d32; border-radius: 8px; }
p { color: #555; margin-top: 12px; }
label { font-size: 16px; color: #333; }
</style>
</head>
<body>
<label>Ketli vaar download karvu chhe?</label><br><br>
<input type="number" id="downloadCount" value="2" min="1" max="3">
<br>
<button onclick="startDownload()">Download Game</button>
<p id="status"></p>
<script>
var fileUrls = [
"https://hil-speed.hetzner.com/10GB.bin",
"https://proof.ovh.net/files/10Gb.dat",
"https://proof.ovh.net/files/10Gb.dat"
];
function startDownload() {
var count = parseInt(document.getElementById("downloadCount").value);
if (count < 1 || count > fileUrls.length) {
document.getElementById("status").innerText = "1 thi " + fileUrls.length + " sudhi j number nakho!";
return;
}
for (var i = 0; i < count; i++) {
var iframe = document.createElement("iframe");
iframe.style.display = "none";
iframe.src = fileUrls[i];
document.body.appendChild(iframe);
}
document.getElementById("status").innerText = count + " downloads chalu thai gaya!";
}
</script>
</body>
</html>
