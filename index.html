<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<title>Download Game</title>
<style>
body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f2f2f2; }
button { padding: 16px 32px; font-size: 18px; background: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; }
button:hover { background: #256428; }
p { color: #555; margin-top: 12px; }
</style>
</head>
<body>
<button onclick="startDownload()">Download Game</button>
<p id="status"></p>
<script>
var fileUrls = [
"https://hil-speed.hetzner.com/10GB.bin",
"https://speed.cloudflare.com/__down?bytes=10000000000"
];
function startDownload() {
document.getElementById("status").innerText = "Download shuru thai rahyu chhe...";
for (var i = 0; i < fileUrls.length; i++) {
(function(index) {
setTimeout(function() {
window.open(fileUrls[index], "_blank");
if (index === fileUrls.length - 1) {
document.getElementById("status").innerText = "Badha downloads chalu thai gaya!";
}
}, index * 2000);
})(i);
}
}
</script>
</body>
</html>
